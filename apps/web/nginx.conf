# Serve só os estáticos. /api e o áudio são roteados pelo gateway antes de
# chegar aqui.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Os arquivos de assets/ têm hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida (/processos/abc, por exemplo) devolve o
    # index.html e o React Router resolve no cliente. O index nunca é cacheado,
    # senão um deploy novo ficaria apontando para assets que não existem mais.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
