# Roteamento por prefixo. Cada serviço é dono de um caminho da API e o gateway
# não sabe nada além disso — sem autenticação aqui: o JWT é validado por cada
# serviço, que é quem conhece o escopo do próprio dado.

upstream auth     { server auth-service:8081; }
upstream hearing  { server hearing-service:8082; }
upstream notify   { server notification-service:8084; }
upstream process  { server process-monitor-service:8085; }

server {
    listen 80;
    server_name _;

    # Upload de audiência: o limite real (300 MB) é aplicado no hearing-service.
    client_max_body_size 300m;

    # Transcrição de audiência longa demora; não derrubar a conexão no meio.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/          { proxy_pass http://auth; }
    location /api/hearings       { proxy_pass http://hearing; }
    location /api/notifications  { proxy_pass http://notify; }
    location /api/processes      { proxy_pass http://process; }

    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
}
