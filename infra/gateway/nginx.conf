# Roteamento por prefixo. Cada serviço é dono de um caminho da API e o gateway
# não sabe nada além disso — sem autenticação aqui: o JWT é validado por cada
# serviço, que é quem conhece o escopo do próprio dado.

# Resolve os nomes pelo DNS do Docker e continua resolvendo: quando um serviço
# é recriado ele ganha outro IP, e sem isso o gateway ficaria mandando para o
# endereço antigo (502) até ser reiniciado.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream auth     { zone auth 64k; server auth-service:8081 resolve; }
upstream hearing  { zone hearing 64k; server hearing-service:8082 resolve; }
upstream notify   { zone notify 64k; server notification-service:8084 resolve; }
upstream process  { zone process 64k; server process-monitor-service:8085 resolve; }
upstream web      { zone web 64k; server web:80 resolve; }
upstream storage  { zone storage 64k; server minio:9000 resolve; }

server {
    listen 80;
    server_name _;

    # Upload de audiência: o limite real (300 MB) é aplicado no hearing-service.
    client_max_body_size 300m;

    # Transcrição de audiência longa demora; não derrubar a conexão no meio.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/          { proxy_pass http://auth; }
    location /api/hearings       { proxy_pass http://hearing; }
    location /api/notifications  { proxy_pass http://notify; }
    location /api/processes      { proxy_pass http://process; }

    # Áudio da audiência via URL pré-assinada. A assinatura foi calculada para
    # o host interno minio:9000, então é esse Host que precisa chegar ao MinIO;
    # o navegador só troca a origem (ver urlDeAudio no front). O bucket segue
    # privado: sem assinatura válida o MinIO responde 403.
    location /meirinho-audio/ {
        proxy_pass http://storage;
        proxy_set_header Host minio:9000;
        proxy_buffering off;
    }

    # Todo o resto é o front-end.
    location / { proxy_pass http://web; }

    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
}
