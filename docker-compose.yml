# Sobe o MVP inteiro. `docker compose up --build` numa máquina limpa, sem
# nenhuma credencial externa: transcrição e análise caem no mock por padrão.
#
# Ordem: infraestrutura -> migrate (roda e sai) -> serviços.
#
# Os padrões servem para rodar local. Em qualquer servidor, defina ao menos
# JWT_SECRET, POSTGRES_PASSWORD, APP_DB_PASSWORD e MINIO_ROOT_PASSWORD (use só
# letras e números nas senhas do banco: elas entram numa URL de conexão).

# Sem âncoras YAML (&/<<) de propósito: o Easypanel reescreve o compose antes
# de subir e perde as chaves mescladas — os serviços subiam sem DATABASE_URL.
# O custo é repetir o bloco de ambiente comum em cada serviço Go.

services:
  postgres:
    build:
      context: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meirinho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meirinho}
      POSTGRES_DB: meirinho
      # Senha do papel meirinho_app, criado por infra/postgres/init.sh.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-meirinho_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem porta publicada: só os serviços da rede interna falam com o banco.
    # Para inspecionar local: docker compose exec postgres psql -U meirinho
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meirinho -d meirinho"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meirinho}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-meirinho123}
    volumes:
      - miniodata:/data
    # Sem porta publicada: o áudio sai pelo gateway com URL assinada.

  # Roda como dono do banco (meirinho), não como meirinho_app: o dono aplica
  # DDL e concede os grants que o papel da aplicação usa.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_PATH: ./cmd/migrate
    environment:
      DATABASE_URL: postgres://meirinho:${POSTGRES_PASSWORD:-meirinho}@postgres:5432/meirinho?sslmode=disable
      # Mantém a senha do papel meirinho_app igual à variável a cada deploy.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-meirinho_app}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth-service:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args: {CMD_PATH: ./services/auth-service}
    environment:
      # Os serviços conectam como meirinho_app: sem BYPASSRLS, é o que faz o
      # isolamento por tenant valer no banco e não só na aplicação.
      DATABASE_URL: postgres://meirinho_app:${APP_DB_PASSWORD:-meirinho_app}@postgres:5432/meirinho?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meirinho}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meirinho123}
      MINIO_BUCKET: meirinho-audio
      ANALYZER: ${ANALYZER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: "8081"

  hearing-service:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args: {CMD_PATH: ./services/hearing-service}
    environment:
      # Os serviços conectam como meirinho_app: sem BYPASSRLS, é o que faz o
      # isolamento por tenant valer no banco e não só na aplicação.
      DATABASE_URL: postgres://meirinho_app:${APP_DB_PASSWORD:-meirinho_app}@postgres:5432/meirinho?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meirinho}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meirinho123}
      MINIO_BUCKET: meirinho-audio
      ANALYZER: ${ANALYZER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: "8082"

  analysis-service:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args: {CMD_PATH: ./services/analysis-service}
    environment:
      # Os serviços conectam como meirinho_app: sem BYPASSRLS, é o que faz o
      # isolamento por tenant valer no banco e não só na aplicação.
      DATABASE_URL: postgres://meirinho_app:${APP_DB_PASSWORD:-meirinho_app}@postgres:5432/meirinho?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meirinho}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meirinho123}
      MINIO_BUCKET: meirinho-audio
      ANALYZER: ${ANALYZER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: "8083"

  notification-service:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args: {CMD_PATH: ./services/notification-service}
    environment:
      # Os serviços conectam como meirinho_app: sem BYPASSRLS, é o que faz o
      # isolamento por tenant valer no banco e não só na aplicação.
      DATABASE_URL: postgres://meirinho_app:${APP_DB_PASSWORD:-meirinho_app}@postgres:5432/meirinho?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meirinho}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meirinho123}
      MINIO_BUCKET: meirinho-audio
      ANALYZER: ${ANALYZER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: "8084"
      NOTIFY_URGENCIA_MINIMA: ${NOTIFY_URGENCIA_MINIMA:-baixa}
      NOTIFY_EMAIL_ENABLED: ${NOTIFY_EMAIL_ENABLED:-false}
      # WhatsApp existe no modelo, mas não há provedor contratado no MVP.
      NOTIFY_WHATSAPP_ENABLED: ${NOTIFY_WHATSAPP_ENABLED:-false}

  process-monitor-service:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args: {CMD_PATH: ./services/process-monitor-service}
    environment:
      # Os serviços conectam como meirinho_app: sem BYPASSRLS, é o que faz o
      # isolamento por tenant valer no banco e não só na aplicação.
      DATABASE_URL: postgres://meirinho_app:${APP_DB_PASSWORD:-meirinho_app}@postgres:5432/meirinho?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meirinho}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meirinho123}
      MINIO_BUCKET: meirinho-audio
      ANALYZER: ${ANALYZER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: "8085"
      PROCESS_PROVIDER: ${PROCESS_PROVIDER:-mock}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      # Probabilidade de o provider mock inventar um andamento por consulta.
      MOCK_MOVEMENT_CHANCE: ${MOCK_MOVEMENT_CHANCE:-0.35}

  transcription-worker:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args: {CMD_PATH: ./services/transcription-worker}
    environment:
      # Os serviços conectam como meirinho_app: sem BYPASSRLS, é o que faz o
      # isolamento por tenant valer no banco e não só na aplicação.
      DATABASE_URL: postgres://meirinho_app:${APP_DB_PASSWORD:-meirinho_app}@postgres:5432/meirinho?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meirinho}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meirinho123}
      MINIO_BUCKET: meirinho-audio
      ANALYZER: ${ANALYZER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: "8086"
      TRANSCRIBER: ${TRANSCRIBER:-mock}

  classification-worker:
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      args: {CMD_PATH: ./services/classification-worker}
    environment:
      # Os serviços conectam como meirinho_app: sem BYPASSRLS, é o que faz o
      # isolamento por tenant valer no banco e não só na aplicação.
      DATABASE_URL: postgres://meirinho_app:${APP_DB_PASSWORD:-meirinho_app}@postgres:5432/meirinho?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meirinho}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-meirinho123}
      MINIO_BUCKET: meirinho-audio
      ANALYZER: ${ANALYZER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: "8087"
      CLASSIFY_PISO: ${CLASSIFY_PISO:-media}
      CLASSIFY_MIN_CONFIANCA: ${CLASSIFY_MIN_CONFIANCA:-0.6}
      # O mock simula latência de modelo; na classificação ela se multiplica
      # pelo histórico inteiro de cada processo novo, então fica curta.
      MOCK_ANALYZE_DELAY: ${MOCK_CLASSIFY_DELAY:-300ms}

  # Conta de demonstração com dados. Roda uma vez e sai; só faz algo com
  # SEED_DEMO=true (é idempotente, então pode ficar ligado entre deploys).
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      args: {CMD_PATH: ./cmd/seed}
    environment:
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_API_URL: http://gateway
      SEED_EMAIL: ${SEED_EMAIL:-demo@meirinho.dev}
      SEED_SENHA: ${SEED_SENHA:-meirinho123}
    depends_on: [gateway]
    restart: "no"

  # Front-end (apps/web): só estáticos; o gateway é quem expõe.
  web:
    build:
      context: ./apps/web
    restart: unless-stopped

  # Porta única para o cliente: sem isso o front precisaria conhecer sete
  # endereços e lidar com CORS de cada um.
  gateway:
    build:
      context: ./infra/gateway
    # Nenhuma porta publicada aqui: no Easypanel o domínio aponta para o
    # serviço "gateway", porta 80. Para rodar local, docker-compose.local.yml
    # publica em localhost:8080 (o .env.example já o inclui via COMPOSE_FILE).
    expose: ["80"]
    depends_on: [auth-service, hearing-service, notification-service, process-monitor-service, web, minio]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
